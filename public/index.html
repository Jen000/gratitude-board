<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gratitude Board</title>
  <meta name="description" content="A shared board where you and your people add something you're grateful for, every day.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- ============ Home ============ -->
  <main id="home" class="view" hidden>
    <header class="hero">
      <div class="sun" aria-hidden="true"></div>
      <h1>Gratitude Board</h1>
      <p id="greeting" class="lede">A shared board where you and your people add one good thing, every day.</p>
    </header>

    <section id="recent" class="card" hidden>
      <h2>Your boards</h2>
      <ul id="recent-list" class="recent-list"></ul>
    </section>

    <div class="two-up">
      <form id="join-form" class="card" novalidate>
        <h2>Have a code?</h2>
        <label for="join-code">Board code</label>
        <input id="join-code" class="code-input" name="code" autocomplete="off" autocapitalize="characters"
               spellcheck="false" maxlength="12" placeholder="ABC123" required>
        <p class="error" id="join-error" role="alert"></p>
        <button type="submit" class="btn">Open board</button>
      </form>

      <form id="create-form" class="card" novalidate>
        <h2>Start a new board</h2>
        <label for="create-title">Board name</label>
        <input id="create-title" name="title" maxlength="60" placeholder="The Shaye family, Team Friday…">
        <label for="create-name">Your name</label>
        <input id="create-name" name="name" maxlength="40" autocomplete="given-name" placeholder="So people know it's you" required>
        <p class="error" id="create-error" role="alert"></p>
        <button type="submit" class="btn btn-primary">Create board</button>
      </form>
    </div>
  </main>

  <!-- ============ Board ============ -->
  <main id="board" class="view" hidden>
    <nav class="topbar">
      <a href="/" id="home-link" class="back">← All boards</a>
    </nav>

    <header class="board-head">
      <h1 id="board-title"></h1>
      <div class="share">
        <span class="share-label">Code</span>
        <button type="button" id="copy-code" class="code-chip" title="Copy code"></button>
        <button type="button" id="share-btn" class="btn btn-small">Invite people</button>
        <span id="share-status" class="share-status" role="status"></span>
      </div>
    </header>

    <form id="entry-form" class="card composer" novalidate>
      <div id="name-row">
        <label for="entry-name">Your name</label>
        <input id="entry-name" name="name" maxlength="40" autocomplete="given-name" placeholder="So people know it's you" required>
      </div>
      <p id="posting-as" class="posting-as" hidden>
        Adding as <strong id="posting-name"></strong>
        <button type="button" id="change-name" class="link">change</button>
      </p>
      <label for="entry-text" id="entry-label">What are you grateful for today?</label>
      <textarea id="entry-text" name="text" rows="3" maxlength="500" placeholder="Something big, something small…" required></textarea>
      <p class="error" id="entry-error" role="alert"></p>
      <div class="composer-foot">
        <span id="today-status" class="muted"></span>
        <button type="submit" class="btn btn-primary">Add to the board</button>
      </div>
    </form>

    <section id="entries" aria-live="polite"></section>
  </main>

  <!-- ============ Not found ============ -->
  <main id="missing" class="view" hidden>
    <div class="card center">
      <h1>We couldn't find that board</h1>
      <p class="lede">Double-check the code — it's six letters and numbers.</p>
      <a href="/" class="btn">Back to start</a>
    </div>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
